<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send an encrypted file</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <main>
    <h1>Send an encrypted file</h1>
    <p>Start the receiver first, then enter its connection settings.</p>
    <form id="transfer-form">
      <label for="host">Receiver hostname or IP address</label>
      <input id="host" required value="127.0.0.1" autocomplete="off">
      <label for="port">TCP port</label>
      <input id="port" type="number" required min="1" max="65535" value="3000">
      <label for="password">Shared password</label>
      <input id="password" type="password" required autocomplete="off">
      <div class="file"><button id="pick" type="button">Choose file</button> <span id="filename">No file selected</span></div>
      <button id="send" type="submit" disabled>Send file</button>
    </form>
    <progress id="progress" max="1" value="0" aria-label="Bytes sent"></progress>
    <p id="status" role="status" aria-live="polite">Choose a file to begin.</p>
  </main>
</body>
</html>
